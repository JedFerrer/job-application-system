[project]
name = "job-application-api"
version = "0.1.0"
description = "AI job application CRM — single-user MVP backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.8",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.14",
    "greenlet>=3.1",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "tenacity>=9.1",
    "httpx>=0.28",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openai>=1.60",
    "slowapi>=0.1.9",
    "structlog>=25.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "google-auth[requests]>=2.38",
    "html2text>=2025",
]

# Phase 2 (job ingestion) extras. python-jobspy pulls numpy/pandas, which on
# Python 3.13 require prebuilt wheels (no source build / C compiler on Windows).
# Install with: pip install -e ".[scraping]" once on a platform with wheels.
[project.optional-dependencies]
scraping = [
    "python-jobspy>=1.1.80",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.1",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501", "N999"]
# Immutable legacy migrations that predate the current import/union style.
"migrations/versions/0016_job_filter_indexes.py" = ["UP007", "UP035"]
"migrations/versions/0025_public_company_index.py" = ["I001", "UP007", "UP035"]
"migrations/versions/135bba47a82c_add_company_logo_to_jobs.py" = ["I001"]
# FastAPI uses callables (Depends/File/Query/Body) as argument defaults by design.
"app/api/**" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jobspy.*", "pandas.*", "pdfplumber.*", "docx.*", "pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

# Celery's @task decorator is untyped; allow it within the worker layer only.
[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false

# Legacy database-heavy tests with dynamic pytest/SQLAlchemy fixture boundaries.
# New tests remain fully strict; production modules remain fully strict above.
[[tool.mypy.overrides]]
module = [
    "tests.unit.test_application_activity",
    "tests.unit.test_application_next_actions",
    "tests.unit.test_extension_services",
    "tests.unit.test_feed_separation",
    "tests.unit.test_job_authorization",
    "tests.unit.test_match_authorization",
    "tests.unit.test_match_pagination",
    "tests.unit.test_match_readiness",
    "tests.unit.test_match_ranking_retention",
    "tests.unit.test_pagination",
    "tests.unit.test_profile_integration",
    "tests.unit.test_readiness_preferences",
    "tests.unit.test_refresh_sessions",
    "tests.unit.test_resume_drafts_integration",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
disable_error_code = ["no-untyped-def", "no-untyped-call"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: Tests that do not need a database (fast, always safe to run)",
    "integration: Tests that need the verified disposable application database",
]

[tool.coverage.run]
relative_files = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
