[project]
name = "job-application-api"
version = "0.1.0"
description = "AI job application CRM — single-user MVP backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.8",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.14",
    "greenlet>=3.1",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "tenacity>=9.1",
    "httpx>=0.28",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openai>=1.60",
    "slowapi>=0.1.9",
    "structlog>=25.1",
]

# Phase 2 (job ingestion) extras. python-jobspy pulls numpy/pandas, which on
# Python 3.13 require prebuilt wheels (no source build / C compiler on Windows).
# Install with: pip install -e ".[scraping]" once on a platform with wheels.
[project.optional-dependencies]
scraping = [
    "python-jobspy>=1.1.80",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.1",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501", "N999"]
# FastAPI uses callables (Depends/File/Query/Body) as argument defaults by design.
"app/api/**" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jobspy.*", "pandas.*", "pdfplumber.*", "docx.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
