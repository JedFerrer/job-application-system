# Standalone broader-backend validation. Never combine with docker-compose.yml.
name: unit1c_validation

services:
  db_test:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_app_test
    volumes:
      - unit1c_validation_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_app_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-test:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db_test:5432/job_app_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db_test:5432/job_app_test
      REDIS_URL: redis://test-redis:6379/0
      EMAIL_DELIVERY_MODE: console
    depends_on:
      db_test:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    command: >
      sh -c "python scripts/verify_unit_1c_validation_env.py &&
             alembic upgrade head &&
             python -m pytest tests/ -v --tb=short --no-header -o 'addopts='"

volumes:
  unit1c_validation_pgdata:
