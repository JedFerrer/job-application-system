<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerOS Assistant</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #737373;
        --border: #e5e5e5;
        --accent: #2563eb;
        --accent-fg: #ffffff;
        --destructive: #dc2626;
        --card: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171717;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --border: #404040;
          --accent: #3b82f6;
          --card: #262626;
        }
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 360px;
        min-height: 200px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        color: var(--fg);
        background: var(--bg);
      }
      #root {
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
